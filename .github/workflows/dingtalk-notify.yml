name: SpinFront DingTalk Notify

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send a test message even if today was already notified'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SpinFront data
        uses: actions/checkout@v4

      - name: Prepare notification
        id: prepare
        shell: bash
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          URL="https://plastocyanin.org/spinfront/${DATE}/"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Check page availability
        shell: bash
        env:
          URL: ${{ steps.prepare.outputs.url }}
        run: |
          STATUS=$(curl -L -sS -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "SpinFront page unavailable: ${STATUS}"
            exit 1
          fi

      - name: Send SpinFront DingTalk notification
        env:
          DINGTALK_WEBHOOKS: ${{ secrets.DINGTALK_WEBHOOKS }}
          DATE: ${{ steps.prepare.outputs.date }}
          URL: ${{ steps.prepare.outputs.url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from scripts.dingtalk_bot import DingTalkBot

          date = os.environ['DATE']
          url = os.environ['URL']

          source = Path('data') / date[:4] / f'SpinFront_{date}.json'
          with source.open('r', encoding='utf-8') as f:
              report = json.load(f)

          items = report.get('items', [])
          nmr = sum('nmr' in (x.get('direction_ids') or []) for x in items)
          epr = sum('epr' in (x.get('direction_ids') or []) for x in items)

          titles = [x.get('title_cn', '').strip() for x in items]
          titles = [x for x in titles if x][:3]

          text = '\n\n'.join([
              f'#### SpinFront | {date}',
              '> NMR / EPR Daily Brief',
              f'本期收录 **{len(items)}** 条 · NMR {nmr} / EPR {epr}',
              '**内容预览**',
              '\n'.join(f'{i}. {t}' for i, t in enumerate(titles, 1)),
              f'[阅读完整日报 →]({url})'
          ])

          bot = DingTalkBot(target='spinfront')
          bot.send_markdown(
              title=f'SpinFront · {date}',
              text=text
          )
          PY
