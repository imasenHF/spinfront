name: SpinFront DingTalk Notify

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send a test message even if today was already notified'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize incoming Cloudflare/manual dispatches so duplicate checks do not race.
concurrency:
  group: spinfront-dingtalk-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SpinFront data
        uses: actions/checkout@v4

      - name: Prepare notification
        id: prepare
        shell: bash
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          URL="https://plastocyanin.org/spinfront/${DATE}/"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Check whether today's notification already succeeded
        id: dedupe
        if: ${{ !inputs.force_send }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/dingtalk-notify.yml/runs?status=success&per_page=100" \
            -o /tmp/spinfront-notify-runs.json

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo('Asia/Shanghai')
          today = datetime.now(timezone).date()
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          with open('/tmp/spinfront-notify-runs.json', encoding='utf-8') as file:
              runs = json.load(file).get('workflow_runs', [])

          matched = None
          for run in runs:
              if run.get('id') == current_run_id:
                  continue
              timestamp = run.get('run_started_at') or run.get('created_at')
              if not timestamp:
                  continue
              started = datetime.fromisoformat(timestamp.replace('Z', '+00:00'))
              if started.astimezone(timezone).date() == today:
                  matched = run['id']
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as file:
              file.write(f"already_sent={'true' if matched else 'false'}\n")
          if matched:
              print(f'SpinFront notification already completed today (run {matched}); skipping.')
          else:
              print('No successful SpinFront notification run today; proceeding.')
          PY

      - name: Skip duplicate notification
        if: ${{ steps.dedupe.outputs.already_sent == 'true' }}
        run: echo 'Notification already delivered today; nothing to send.'
      - name: Check page availability
        if: ${{ steps.dedupe.outputs.already_sent != 'true' }}
        shell: bash
        env:
          URL: ${{ steps.prepare.outputs.url }}
        run: |
          STATUS=$(curl -L -sS -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "SpinFront page unavailable: ${STATUS}"
            exit 1
          fi

      - name: Send SpinFront DingTalk notification
        if: ${{ steps.dedupe.outputs.already_sent != 'true' }}
        env:
          SPINFRONT_DINGTALK_WEBHOOKS: ${{ secrets.SPINFRONT_DINGTALK_WEBHOOKS }}
          DATE: ${{ steps.prepare.outputs.date }}
          URL: ${{ steps.prepare.outputs.url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from scripts.dingtalk_bot import DingTalkBot

          date = os.environ['DATE']
          url = os.environ['URL']

          source = Path('data') / date[:4] / f'SpinFront_{date}.json'
          with source.open('r', encoding='utf-8') as f:
              report = json.load(f)

          items = report.get('items', [])
          nmr = sum('nmr' in (x.get('direction_ids') or []) for x in items)
          epr = sum('epr' in (x.get('direction_ids') or []) for x in items)

          titles = [x.get('title_cn', '').strip() for x in items]
          titles = [x for x in titles if x][:3]

          text = '\n\n'.join([
              f'#### SpinFront | {date}',
              '> NMR / EPR Daily Brief',
              f'本期收录 **{len(items)}** 条 · NMR {nmr} / EPR {epr}',
              '**内容预览**',
              '\n'.join(f'{i}. {t}' for i, t in enumerate(titles, 1)),
              f'[阅读完整日报 →]({url})'
          ])

          bot = DingTalkBot()
          results = bot.send_markdown(
              title=f'SpinFront · {date}',
              text=text
          )

          print(f'Sent DingTalk notifications: {list(results.keys())}')
          PY
